name: ndk-pkg

on:
  workflow_dispatch:

jobs:
  alpine:
 
    runs-on: ubuntu-latest

    container: alpine

    env:
      CARGO_HOST_RUSTFLAGS: -C target-feature=-crt-static

    steps:
      - run: /sbin/apk update
      - run: /sbin/apk add clang-dev

      - run: wget https://raw.githubusercontent.com/leleliu008/ndk-pkg/master/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg setup
      - run: ./ndk-pkg about
      - run: ./ndk-pkg update
      - run: ./ndk-pkg install android-37-arm64-v8a/hurl -v-env -x-cargo --static

  ubuntu:
 
    runs-on: ubuntu-latest

    steps:
      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/master/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg setup
      - run: ./ndk-pkg about
      - run: ./ndk-pkg update
      - run: ./ndk-pkg install android-37-arm64-v8a/hurl -v-env -x-cargo --static

  macos:
 
    runs-on: macos-latest

    steps:
      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/master/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg setup
      - run: ./ndk-pkg about
      - run: ./ndk-pkg update
      - run: ./ndk-pkg install android-37-arm64-v8a/hurl -v-env -x-cargo --static
