name: build musl-libc with clang

on:
  workflow_dispatch:

jobs:

  glibc:

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        target-arch: [powerpc64le, loongarch64, aarch64, riscv64, s390x]

    env:
      CROSS_COMPILE: ${{ matrix.target-arch }}-linux-gnu-
        #CC: ${{ matrix.target-arch }}-linux-gnu-gcc
        #AS: ${{ matrix.target-arch }}-linux-gnu-as
        #AR: ${{ matrix.target-arch }}-linux-gnu-ar
        #RANLIB: ${{ matrix.target-arch }}-linux-gnu-ranlib


    steps:
      - run: cat /etc/os-release

      - run: sudo apt -y update
      - run: sudo apt -y install gcc-${{ matrix.target-arch }}-linux-gnu clang tree

      - run: curl -LO http://musl.libc.org/releases/musl-1.2.6.tar.gz
      - run: install -d musl/src/
      - run: tar xf *.tar.gz -C musl/src/ --strip-components=1

      - run: cd musl/src && ./configure --prefix="$PWD/../out" –with-long-double-64 --enable-wrapper=all
      - run: cd musl/src && make ARCH=${{ matrix.target-arch }}
      - run: cd musl/src && make install

      - run: tree musl/out
