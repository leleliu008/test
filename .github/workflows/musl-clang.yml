name: build musl-libc with clang

on:
  workflow_dispatch:

jobs:

  glibc:

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        target-arch: [powerpc64le, loongarch64, aarch64, riscv64, s390x]

    env:
      CC: ${{ matrix.target-arch }}-linux-gnu-gcc
      AR: ${{ matrix.target-arch }}-linux-gnu-ar
      RANLIB: ${{ matrix.target-arch }}-linux-gnu-ranlib

    steps:
      - run: cat /etc/os-release

      - run: sudo apt -y update
      - run: sudo apt -y install gcc-${{ matrix.target-arch }}-linux-gnu tree

        #- run: curl -LO http://musl.libc.org/releases/musl-1.2.6.tar.gz
      - run: curl -LO https://archive.ubuntu.com/ubuntu/pool/universe/m/musl/musl_1.2.6.orig.tar.gz
      - run: install -d src/musl/
      - run: tar xf *.tar.gz -C src/musl/ --strip-components=1

      - run: cd src/musl/ && ./configure --prefix=${{ github.workspace }}/sysroot --enable-wrapper=all
      - run: cd src/musl/ && make ARCH=${{ matrix.target-arch }}
      - run: cd src/musl/ && make install

      - run: tree ${{ github.workspace }}/sysroot

      - run: sudo apt-get -y install automake autoconf pkg-config make gcc cmake qemu-user-static

      - run: |
          cat >> "$GITHUB_ENV" <<EOF
          CFLAGS=-I${{ github.workspace }}/sysroot/include
          LDFLAGS=-L${{ github.workspace }}/sysroot/lib
          PKG_CONFIG_PATH=${{ github.workspace }}/sysroot/lib/pkgconfig
          EOF

      - name: build zlib
        run: |
          install -d src/libz
          cd         src/libz
          curl -L -o src.tar.gz https://distfiles.macports.org/zlib/zlib-1.3.2.tar.xz
          tar vxf    src.tar.gz --strip-components=1
          cmake -S . -B build.d -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/sysroot -DCMAKE_VERBOSE_MAKEFILE=ON -DZLIB_BUILD_TESTING=OFF -DZLIB_BUILD_STATIC=ON -DZLIB_BUILD_SHARED=OFF
          cmake --build build.d
          cmake --install build.d

      - name: build libiconv
        run: |
          install -d src/libiconv
          cd         src/libiconv
          curl -L -o src.tar.gz https://distfiles.macports.org/libiconv/libiconv-1.19.tar.gz
          tar xf     src.tar.gz --strip-components=1
          ./configure --host=${{ matrix.target-arch }}-unknown-linux-gnu --prefix=${{ github.workspace }}/sysroot --enable-extra-encodings --enable-static --disable-shared
          make V=1
          make install

      - name: build libxml2
        run: |
          install -d src/libxml2
          cd         src/libxml2
          curl -L -o src.tar.gz https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.3.tar.xz
          tar vxf    src.tar.gz --strip-components=1
          ./configure --host=${{ matrix.target-arch }}-unknown-linux-gnu --prefix=${{ github.workspace }}/sysroot --with-zlib --without-lzma --without-python --without-readline --without-coverage --enable-ipv6 --enable-static --disable-shared LIBS=-liconv || (cat config.log; exit 1)
          make V=1
          make install

      - name: build libyaml
        run: |
          install -d src/libyaml
          cd         src/libyaml
          curl -L -o src.tar.gz https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
          tar vxf    src.tar.gz --strip-components=1
          ./configure --host=${{ matrix.target-arch }}-unknown-linux-gnu --prefix=${{ github.workspace }}/sysroot
          make V=1
          make install

      - name: build jansson
        run: |
          install -d src/jansson
          cd         src/jansson
          curl -L -o src.tar.gz https://github.com/akheron/jansson/releases/download/v2.15.0/jansson-2.15.0.tar.gz
          tar vxf    src.tar.gz --strip-components=1
          cmake -S . -B build.d -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/sysroot -DCMAKE_VERBOSE_MAKEFILE=ON -DENABLE_TESTING=OFF -DJANSSON_BUILD_SHARED_LIBS=OFF -DJANSSON_BUILD_DOCS=OFF -DJANSSON_COVERAGE=OFF -DJANSSON_EXAMPLES=OFF -DJANSSON_WITHOUT_TESTS=ON
          cmake --build build.d
          cmake --install build.d

      - name: build libpcre2
        run: |
          install -d src/libpcre2
          cd         src/libpcre2
          curl -L -o src.tar.gz https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2
          tar vxf    src.tar.gz --strip-components=1
          cmake -S . -B build.d -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/sysroot -DCMAKE_VERBOSE_MAKEFILE=ON -DENABLE_TESTING=OFF -DJANSSON_BUILD_SHARED_LIBS=OFF -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DPCRE2_BUILD_PCRE2_8=ON -DPCRE2_BUILD_PCRE2_16=ON -DPCRE2_BUILD_PCRE2_32=ON -DPCRE2_BUILD_PCRE2GREP=OFF -DPCRE2_BUILD_TESTS=OFF -DPCRE2_SUPPORT_VALGRIND=OFF -DPCRE2_SUPPORT_UNICODE=ON
          cmake --build build.d
          cmake --install build.d

      - run: tree ${{ github.workspace }}/sysroot

      - uses: actions/checkout@v5
        with:
          repository: universal-ctags/ctags
          path: ctags

      - run: cd ctags && export -p && ./autogen.sh
      - run: cd ctags && ./configure --host=${{ matrix.target-arch }}-unknown-linux-gnu --enable-debugging CC=${{ github.workspace }}/sysroot/bin/musl-gcc || (cat config.log; exit 1)
      - run: cd ctags && make V=1

      - run: cd ctags && readelf -h ctags
      - run: cd ctags && readelf -d ctags

      - run: sudo apt-get -y install qemu-user

      - run: cd ctags && qemu-${{ matrix.target-arch }} ./ctags --help
      - run: cd ctags && qemu-${{ matrix.target-arch }} ./ctags --version
