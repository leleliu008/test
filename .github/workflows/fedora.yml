name: Fedora

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        tag: [28, 30, 33, latest, rawhide]

    container: fedora:${{ matrix.tag }}

    steps:
      - run: dnf -y update && dnf -y install git
        if: ${{ matrix.tag != 'rawhide' }}

      - uses: actions/checkout@v2

      - run: |
          ls -a .
          cp -r . ..
          ls -a ..
