name: Manjaro Linux

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    container: zelec/manjarolinux

    steps:
      - run: pacman -Syyuu --noconfirm
      - run: pacman -S     --noconfirm git

      - uses: actions/checkout@v2

      - run: |
          ls -a .
          cp -r . ..
          ls -a ..
